// 悠然服务器模组（modid youranmod）。
// 构建：用 JDK 25 运行 Gradle（RetroFuturaGradle 2.x 要求），编译目标 Java 8。照 YouranSCP 的构建精简。
// Mixin（装罐机反应配方）的接法照 YouranSCP：注解与注解处理器取自 MixinBooter，两种引导见 core 包。
plugins {
    id 'java'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

version = property('mod_version')
group = 'moe.qingu.youran'

base {
    archivesName.set('youranmod')
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(8))
        vendor.set(JvmVendorSpec.AZUL)
    }
}

minecraft {
    mcVersion.set('1.12.2')
    mcpMappingChannel.set('stable')
    mcpMappingVersion.set('39')
    username.set('Youran')
}

repositories {
    maven {
        // MixinBooter（CleanroomMC）：只编译（Mixin 注解与注解处理器）
        name 'CleanroomMC'
        url 'https://maven.cleanroommc.com'
        mavenContent {
            includeGroup 'zone.rong'
        }
    }
    maven {
        // 工业时代 2 官方仓库：industrialcraft-2-2.8.221-ex112.jar 与整合包、现网的是同一个文件（SHA-1 43e4af33…10ce）
        name 'IC2'
        url 'https://maven.ic2.player.to/'
        mavenContent {
            includeGroup 'net.industrial-craft'
        }
    }
    maven {
        // CraftTweaker（BlameJared 的仓库）
        name 'BlameJared'
        url 'https://maven.blamejared.com/'
        mavenContent {
            includeGroup 'CraftTweaker2'
            includeGroup 'blusunrize'
            includeGroup 'mezz.jei'
        }
    }
    maven {
        // 匠魂、Mantle（SlimeKnights 的仓库）：与整合包同版本
        name 'SlimeKnights'
        url 'https://dvs1.progwml6.com/files/maven/'
        mavenContent {
            includeGroup 'slimeknights'
            includeGroup 'slimeknights.mantle'
        }
    }
    mavenCentral()
}

// 沉浸原油的 jar（只编译）：放在 libs/ 下，文件名见 gradle.properties 的 ip_jar
def ipJar = file("libs/${property('ip_jar')}")
if (!ipJar.isFile()) {
    throw new GradleException("缺少沉浸原油：把整合包里的 ${property('ip_jar')} 放到 libs/（只编译，不进仓库，见 README）")
}

dependencies {
    // Mixin 注解与注解处理器（生成 refmap）用 MixinBooter 带的 Mixin 0.8；运行时服务端用 SpongeForge 自带的、客户端用 MixinBooter（见 core 包）
    String mixin = modUtils.enableMixins("zone.rong:mixinbooter:${property('mixin_booter_version')}", 'mixins.youranmod.refmap.json')
    compileOnly(mixin) { transitive = false }
    // 注解处理器还要 ASM、Guava、Gson（MixinBooter 的 pom 没带上），同 YouranSCP
    annotationProcessor 'org.ow2.asm:asm-debug-all:5.2'
    annotationProcessor 'com.google.guava:guava:32.1.2-jre'
    annotationProcessor 'com.google.code.gson:gson:2.8.9'
    annotationProcessor(mixin) { transitive = false }
    // 工业时代 2（与现网同版本）：只编译、不打包；只有 compat.ic2 与 mixin.ic2 引用，没装 IC2 时不注册 Mixin、不加载这些类
    compileOnly rfg.deobf('net.industrial-craft:industrialcraft-2:2.8.221-ex112')
    // CraftTweaker 4.1.20.662（与整合包同版本）：只编译、不打包；只有 compat.crafttweaker 引用，没装时不加载
    compileOnly rfg.deobf('CraftTweaker2:CraftTweaker2-MC1120-Main:1.12-4.1.20.662')
    compileOnly 'CraftTweaker2:CraftTweaker2-API:4.1.20.662'
    compileOnly 'CraftTweaker2:ZenScript:4.1.20.662'
    // 沉浸工程（只编译、不打包）：整合包是 0.12-98，Maven 上最新只有 0.12-92（取开发版 deobf，不用反混淆）；用到的灌装机接口
    // BottlingMachineRecipe.addRecipe / findRecipe 与 output 字段两版相同。只有 compat.immersiveengineering 引用，没装时不加载
    compileOnly('blusunrize:ImmersiveEngineering:0.12-92-559:deobf') { transitive = false }
    // 沉浸原油（只编译、不打包）：仓库没有许可证、也不在 Maven 上，不能放进本仓库；把整合包里的 jar 放到 libs/（不进仓库，见 README）。
    // 只有 compat.immersivepetroleum 与 mixin.immersivepetroleum 引用，没装时不注册 Mixin、不加载这些类
    compileOnly rfg.deobf(files(ipJar))
    // 匠魂 2.13.0.183 与 Mantle 1.3.3.55（与整合包同版本）：只编译、不打包；只有 compat.tconstruct 引用（浇铸台的事件、合金与浇铸配方），
    // 没装匠魂时不加载这些类
    compileOnly(rfg.deobf('slimeknights:TConstruct:1.12.2-2.13.0.183')) { transitive = false }
    compileOnly(rfg.deobf('slimeknights.mantle:Mantle:1.12-1.3.3.55')) { transitive = false }
    // JEI（与整合包同版本，只编译它的 API、不打包）：只有 compat.jei 引用，JEI 按注解找插件，没装时不加载
    compileOnly rfg.deobf('mezz.jei:jei_1.12.2:4.16.5.1030:api')

    testImplementation 'org.junit.jupiter:junit-jupiter:5.7.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'mod_version', project.version
    filesMatching(['mcmod.info', 'version.properties']) {
        expand('mod_version': project.version)
    }
}

jar {
    manifest {
        attributes(
            // 核心插件只负责在没有 MixinBooter 的环境（服务端 SpongeForge）注册 Mixin 配置（见 core.YouranCorePlugin）
            'FMLCorePlugin': 'moe.qingu.youran.core.YouranCorePlugin',
            'FMLCorePluginContainsFMLMod': 'true',
            // 不写 MixinConfigs：写了会被当成早期配置在模组上类路径之前处理，找不到 IC2 的类（同 YouranSCP）
        )
    }
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(8)
    })
}

// ---- 分包（服主 11-14）----
// 完整包：reobfJar 的产物 youranmod-<版本>.jar（服务器用，也能单人游戏；单人游戏里有游戏内网络）。
// 客户端包：youranmod-<版本>-client.jar，发给玩家。只比完整包少服务端的实现：server/net 包（服务端权威的网络实现：
// 路由器、地址分配表、DNS 根 / 顶级域 / 递归解析器、NTP、机房服务、测试网站、网卡的服务端校验、测试命令、网络配置）
// 与 server/lang 包（服务端翻译读语言目录与模组 jar 的实现；接口 api.lang 两端都在，客户端包里只有服务端英文）。
// 两端共用的协议栈、网络包、公开 api 包、已有的其他内容照旧都在。不像 YouranSCP 那样严格（服主 11-14）：只查这几个包。
// 打完包后检查（checkClientJar）：客户端包里没有这些包下的文件，别的类也没有直接引用它们；
// 按类名加载的只许 clientReflectiveServerClasses 里登记的（找不到时安静跳过）。不过就删掉产物、构建失败。
def clientExcludedPrefixes = ['moe/qingu/youran/server/net/', 'moe/qingu/youran/server/lang/']
def clientReflectiveServerClasses = ['moe.qingu.youran.server.net.NetworkServer', 'moe.qingu.youran.server.lang.ServerLangLoader']
def reobfJarFile = tasks.named('reobfJar').flatMap { it.archiveFile }

def checkClientJar = { File file ->
    def problems = []
    int classCount = 0
    new java.util.zip.ZipFile(file).withCloseable { z ->
        z.entries().toList().findAll { !it.directory }.each { e ->
            if (clientExcludedPrefixes.any { e.name.startsWith(it) }) {
                problems << "不该在客户端包里：${e.name}"
                return
            }
            if (!e.name.endsWith('.class')) {
                return
            }
            classCount++
            // 常量池里的 UTF-8 串按 ISO-8859-1 读出来，类名部分是 ASCII，直接找
            String text = new String(z.getInputStream(e).bytes, 'ISO-8859-1')
            clientExcludedPrefixes.each { String prefix ->
                if (text.contains(prefix)) {
                    problems << "${e.name} 直接引用了客户端包里没有的 ${prefix} 下的类"
                }
                String dotted = java.util.regex.Pattern.quote(prefix.replace('/', '.'))
                (text =~ (dotted + /[A-Za-z0-9_$]+/)).each { String ref ->
                    if (!clientReflectiveServerClasses.contains(ref)) {
                        problems << "${e.name} 按类名引用了 ${ref}（找不到时要安静跳过，确认后登记进 clientReflectiveServerClasses）"
                    }
                }
            }
        }
    }
    if (!problems.isEmpty()) {
        file.delete()
        throw new GradleException("客户端包检查没过（产物已删除）：\n  " + problems.join('\n  '))
    }
    logger.lifecycle("客户端包检查通过：${file.name}，${classCount} 个类，没有 ${clientExcludedPrefixes.join('、')}，也没有类引用它们")
}

def clientJar = tasks.register('clientJar', Zip) {
    group = 'build'
    description = '客户端包（发给玩家）：完整包去掉服务端的网络实现与服务端翻译的实现，打完检查引用'
    archiveBaseName.set(base.archivesName)
    archiveVersion.set(project.version.toString())
    archiveClassifier.set('client')
    archiveExtension.set('jar')
    destinationDirectory.set(layout.buildDirectory.dir('libs'))
    preserveFileTimestamps = false
    includeEmptyDirs = false
    from(zipTree(reobfJarFile)) {
        clientExcludedPrefixes.each { exclude "${it}**" }
    }
    doLast {
        checkClientJar(archiveFile.get().asFile)
    }
}

tasks.named('assemble') {
    dependsOn clientJar
}
